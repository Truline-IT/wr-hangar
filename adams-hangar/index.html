<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adam's Hangar</title>
<meta name="description" content="Moody.Adam Hangar, War Robots command deck.">
<meta http-equiv="refresh" content="2;url=https://claude.ai/artifact/2FxhPEpgcgYHjX7quLprag">
<link rel="canonical" href="https://claude.ai/artifact/2FxhPEpgcgYHjX7quLprag">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#1a2430; --bg2:#141d27; --panel:#243040; --panel2:#2c3a4c;
  --line:#415263; --edge:#5a7089; --fg:#e9f0f7; --dim:#9db0c4; --faint:#73879b;
  --amber:#ff9326; --amber2:#ffbb66; --cyan:#3fd0f5;
  --display:"Saira Condensed",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
  background:
    linear-gradient(rgba(63,208,245,.05) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(63,208,245,.05) 1px,transparent 1px) 0 0/34px 100%,
    radial-gradient(130% 85% at 50% 0%,#2a3848 0%,var(--bg) 52%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.6;
}
.card{
  width:100%;max-width:520px;padding:30px 28px 26px;
  background:linear-gradient(170deg,var(--panel),#202c3a);
  border:1px solid var(--line);border-top:2px solid var(--amber);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 18px 50px rgba(0,0,0,.5);
}
h1{
  font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:2.5px;
  text-transform:uppercase;margin:0 0 4px;color:var(--amber);line-height:1;
  text-shadow:0 0 18px rgba(255,147,38,.45);
}
.sub{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--faint);margin-bottom:22px}
p{color:var(--dim);margin:0 0 16px;font-size:13px}
.note{
  font-size:12px;color:var(--dim);border-left:3px solid var(--cyan);
  background:rgba(63,208,245,.06);padding:10px 13px;margin:0 0 22px;
}
a.go{
  display:inline-block;font-family:var(--display);font-size:16px;font-weight:700;
  letter-spacing:1.8px;text-transform:uppercase;text-decoration:none;
  background:linear-gradient(180deg,var(--amber2),var(--amber));color:#17120a;
  padding:13px 26px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  box-shadow:0 0 18px rgba(255,147,38,.32);
}
a.go:hover{filter:brightness(1.1)}
.tick{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:11px;color:var(--faint);letter-spacing:1px}
.dot{width:7px;height:7px;background:var(--amber);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:1}}
</style>
</head>
<body>
<main class="card">
  <h1>Adam's Hangar</h1>
  <div class="sub">War Robots command deck</div>
  <p>Taking you to the hangar now.</p>
  <div class="note">The hangar runs on Claude, so you will be asked to sign in. Without an account the page stays empty.</div>
  <a class="go" href="https://claude.ai/artifact/2FxhPEpgcgYHjX7quLprag">Enter the hangar</a>
  <div class="tick"><span class="dot"></span>Redirecting</div>
</main>
<script>
setTimeout(function(){
  location.replace("https://claude.ai/artifact/2FxhPEpgcgYHjX7quLprag");
}, 1600);
</script>
</body>
</html>
