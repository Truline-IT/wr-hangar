name: War Robots news

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Developers' news, patch notes and Reddit
        run: python3 .github/scripts/war_robots_sources.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: YouTube videos
        run: python3 .github/scripts/youtube_feed.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Rebuild the site search
        run: node tools/build-search-index.mjs
      - name: Commit if anything changed
        run: |
          git add news shared/search-index.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "gragg.life bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "News: new War Robots updates"
          git push
