name: War Robots YouTube updates

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/youtube_feed.py
      - name: Commit if the feed changed
        run: |
          if git diff --quiet news/videos.json; then echo "No new videos."; exit 0; fi
          git config user.name "gragg.life bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/videos.json
          git commit -m "News: new War Robots videos"
          git push
